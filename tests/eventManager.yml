- event: 
    date: '2022-12-27'
    label: 'Priority Dataset'
    run: 
      - label: 'timeIndependent'
        overwrite: True
        config: {src: 'CSYRML', aia: 'bas_more', keepI0: [3, 5, 6], useMask: True, line: 'main'}
    src:
      - id: {'instrument': 'ViSP', 'data': 'CSYRML', mod: ""}
        theme: '#057BBB'
        clustering:
          main:
            intrinsic: 
              - {label: 'continuum', layerConfig: {'bins': [0, 0.75, 1.0]}}
              - {label: 'window', layerConfig: {'bins': [0, 0.42, 0.55, 1]}}
            optimized: 
              - {layerGroups: [1, 1, 2, 1, 1, 2]}   
              - {layerGroups: [1,1,4,4,1,4,3,4]} 
        axisFit: {coeff: [18.8546e-3, 8531.8541], unit: "angstrom"}
        spectralParams:
          continuum: 26
          lineList:
            - {label: 'main', window: [484, 603], center: 544}
            - {label: 'H2O', window: [464, 484], center: 544}
- event:
    date: '2023-05-03'
    label: 'Strong flare signatures'
    run: 
      - label: 'timeIndependent'
        overwrite: True
        config: {keepI0: [3], timeFrames: [0, 3], bbox: [0, 125, 1188, 1629], src: 'AEVEG', line: 'main'}
    src: 
      - id: {'instrument': 'ViSP', 'data': 'AEVEG', mod: ""}
        clustering:
          main:
            intrinsic: 
              - {label: 'window', layerConfig: {'bins': [0, 0.45, 0.60, 1]}}
            optimized: 
              - {layerGroups: [1, 1, 2]}
              - {layerGroups: [1, 1, 5, 5]}
        axisFit: {coeff: [-2.81754321e-8, 1.91621915e-3,  8.53133874e+2], unit: "nm"}
        spectralParams:
          continuum: 26
          lineList:
            - {label: 'main?', window: [462, 568], center: 515, theme: '#527A00'}
            - {label: 'main', window: [525, 611], center: 568, theme: '#527A00'}

      - id: {'instrument': 'ViSP', 'data': 'BZNNG', mod: ""}
        theme: {'D1': '#0000FF', 'D2': '#FF0000', 'Ni': '#FF0000'}
        residual: True
        axisFit: {coeff: [-1.60283877e-8, 1.42050858e-3,  5.88875195e+2], unit: "nm"}
        spectralParams:
          continuum: 375
          lineList:
            - {label: 'D2', center: 86,  window: [51, 121]}
            - {label: 'D1', center: 509, window: [473, 545]}
            - {label: 'Ni', center: 291, window: [256, 327]}
- event:
    date: '2024-08-08'
    label: 'Strong flare signatures'
    run: 
      - label: 'timeIndependentXClass'
        overwrite: True
        config: {keepI0: [3], timeFrames: [0, 3], bbox: [0, 91,1750, 2548], src: 'BWVCXN', line: 'narrow'}
    src: 
      - id: {'instrument': 'ViSP', 'data': 'BWVCXN', mod: ""}
        clustering:
          narrow:
            intrinsic: 
              - {label: 'window', layerConfig: {'bins': [0, 0.45, 0.55, 1]}}
            optimized: 
              - {layerGroups: [1, 1, 3]}
              - {layerGroups: [1, 4, 4, 4, 4]}
        spectralParams:
          continuum: 825
          lineList:
            - {label: 'narrow', window: [390, 545], center: 467, theme: '#527A00'}
            - {label: 'broad', window: [375, 505], center: 517, theme: '#527A00'}
