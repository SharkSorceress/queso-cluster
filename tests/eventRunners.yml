- event: 
    date: '2022-12-27'
    label: 'Priority Dataset'
    run: 
      - label: 'paper01_final'
        approach: 'epoch'
        overwrite: True
        qs: 'paper01-qs'
        config: {src: 'CSYRML-P01_1', aia: 'bas_more', keepI0: [3, 5, 6], useMask: True}
      - label: 'paper01-qs'
        approach: 'epoch'
        overwrite: True
        qs: 'paper01-qs'
        config: {src: 'CSYRML-P01_QS', aia: 'bas_more', keepI0: [4], useMask: False}
    src:
      - id: {'instrument': 'ViSP', 'data': 'CSYRML', mod: "P01_1"}
        theme: '#057BBB'
        clustering:
          S0: 
          - label: 'continuum'
            layerConfig: {'bins': [0, 0.75, 1.0]}
          - label: 'window'
            layerConfig: {'bins': [0, 0.42, 0.55, 0.84]}
          S1: 
          - layerGroups: [1, 1, 2, 1, 1, 2]
            layerConfig: {'converge': 0, similarity: 'dist', ss_thresh: [0, 0.66, 0, 0, 0.53]}
          - layerGroups: [1,1,4,4,1,4,4,3]
            layerConfig: {'converge': 0, similarity: 'dist', ss_thresh: [0,0.74, 0.77,0,0.7,0.53, 0.56]}
        axis_fit: {coeff: [18.8546e-3, 8531.8541], unit: "A"}
        lines:
          - {label: 'main', continuum: 26, window: [484, 603], core: 544}
      - id: {'instrument': 'ViSP', 'data': 'CSYRML', mod: "P01_9"}
        theme: '#057BBB'
        clustering:
          S0: 
          - label: 'continuum'
            layerConfig: {'bins': [0, 0.75, 1.0]}
          - label: 'window'
            layerConfig: {'bins': [0, 50, 66, 100]}
          S1: 
          - layerGroups: [1, 1, 2, 1, 1, 2]
            layerConfig: {'converge': 0, similarity: 'dist', ss_thresh: [0, 0.66, 0, 0, 0.53]}
          - layerGroups: [1,1,4,4,1,4,4,3]
            layerConfig: {'converge': 0, similarity: 'dist', ss_thresh: [0,0,1,1,0,1,1, 1]}
        axis_fit: {coeff: [18.8546e-3, 8531.8541], unit: "A"}
        lines:
          - {label: 'main', continuum: 26, window: [484, 604], core: 544}               
      - id: {'instrument': 'ViSP', 'data': 'CSYRML', mod: "P01_2"}
        theme: '#057BBB'
        clustering:
          S0: 
          - label: 'continuum'
            layerConfig: {'bins': [0, 0.75, 1.0]}
          - label: 'window'
            layerConfig: {'bins': [0, 30, 42, 70]}
          S1: 
          - layerGroups: [1, 1, 2, 1, 1, 2]
            layerConfig: {'converge': 1e-6, similarity: 'dist', ss_thresh: [0, 0, 0, 0, 0, 0]}
          - layerGroups: [1,1,4,4,1,4,4,3]
            layerConfig: {'converge': 1e-6, similarity: 'dist', ss_thresh: [0,0,0,0,0,0,0, 0]}
        axis_fit: {coeff: [18.8546e-3, 8531.8541], unit: "A"}
        lines:
          - {label: 'main', continuum: 26, window: [506, 582], core: 544}     
      - id: {'instrument': 'ViSP', 'data': 'CSYRML', mod: "P01_ribbonMask"}
        theme: '#057BBB'
        clustering:
          S0: 
          - label: 'continuum'
            layerConfig: {'bins': [0, 0.75, 1.0]}
          - label: 'window'
            layerConfig: {'bins': [0, 50, 70]}
          S1: 
          - layerGroups: [1, 1, 1, 1, 1]
            layerConfig: {'converge': 1e-6, similarity: 'dist', ss_thresh: [0, 0, 0, 0, 0]}
          - layerGroups: [1,4,1,4,4]
            layerConfig: {'converge': 1e-6, similarity: 'dist', ss_thresh: [0,0,0,0,0,0,0]}
        axis_fit: {coeff: [18.8546e-3, 8531.8541], unit: "A"}
        lines:
          - {label: 'main', continuum: 26, window: [506, 582], core: 544}                       
      - id: {'instrument': 'ViSP', 'data': 'CSYRML', mod: "P01_QS"}
        theme: '#057BBB'
        clustering:
          S0: 
          - label: 'continuum'
            layerConfig: {'bins': [0, 0.75, 1.0]}
          - label: 'window'
            layerConfig: {'bins': [0, 0.42, 0.55, 0.84]}
          S1: 
          - layerGroups: [1, 1, 1, 2, 1, 1]
            layerConfig: {'converge': 1e-6, similarity: 'dist', ss_thresh: [0, 0, 0, 0, 0, 0]}
          - layerGroups: [1, 1, 1, 3, 3, 1, 1, 1]
            layerConfig: {'converge': 1e-5, similarity: 'dist', ss_thresh: [0, 0, 0, 0, 0, 0, 0, 0]}
        axis_fit: {coeff: [18.8546e-3, 8531.8541], unit: "A"}
        lines:
          - {label: 'main', continuum: 26, window: [484, 604], core: 544}
      - id: {'instrument': 'ViSP', 'data': 'CSYRML', mod: "P01_QS_1"}
        theme: '#057BBB'
        clustering:
          S0: 
          - label: 'continuum'
            layerConfig: {'bins': [0, 0.75, 1.0]}
          - label: 'window'
            layerConfig: {'bins': [0, 0.42, 0.55, 0.84]}
          S1: 
          - layerGroups: [1, 1, 1, 3, 1, 1]
            layerConfig: {'converge': 1e-6, similarity: 'dist', ss_thresh: [0, 0, 0, 0, 0, 0]}
          - layerGroups: [1, 1, 1, 3, 3, 3, 1, 1, 1]
            layerConfig: {'converge': 1e-5, similarity: 'dist', ss_thresh: [0, 0, 0, 0, 0, 0, 0, 0, 0]}
        axis_fit: {coeff: [18.8546e-3, 8531.8541], unit: "A"}
        lines:
          - {label: 'main', continuum: 26, window: [484, 604], core: 544}
- event:
    date: '2023-05-03'
    label: 'Strong flare signatures'
    run: 
      - label: 'SPD-2025Jun'
        approach: 'evo'
        overwrite: False
        alignment_dir: "aligned_x5bin"
        config: {frames: [-1, 3, 1],
              bbox: [0, 125, 1188, 1629],
              primary: {src: 'AEVEG-SPD', S1: [1, 5, 2, 4, 1], lines: {'AEVEG': ['main']}}, 
              support: {src: 'BZNNG-SPD', lines: {BZNNG: ['D1', 'D2']}}}
      - label: 'paper02_dev'
        approach: 'evo'
        overwrite: False
        alignment_dir: "aligned_x5bin"
        config: {frames: [-1, 3, 1],
              bbox: [0, 125, 1188, 1629],
              primary: {src: 'AEVEG-SPD', S1: [1, 5, 2, 4, 1], lines: {'AEVEG-SPD': ['main']}}, 
              support: {src: 'BZNNG-SPD', lines: {BZNNG-SPD: ['D1', 'D2']}}}
      - label: 'paper02_queso'
        approach: 'evo'
        overwrite: True
        alignment_dir: "aligned_x5bin"
        config: {frames: [-1, 3, 1],
              keepI0: [2],
              bbox: [0, 125, 1188, 1629],
              primary: {src: 'AEVEG-SPD', S1: [1, 5, 2, 4, 1], lines: {'AEVEG-SPD': ['main']}}, 
        }
    src: 
      - id: {'instrument': 'ViSP', 'data': 'AEVEG', mod: "SPD"}
        theme: '#527A00'
        residual: False
        clustering:
          S0: 
            - {label: 'window', layerConfig: {'bins': [0, 0.51, 0.61, 0.94]}}
          S1: 
            - {layerGroups: 5, layerConfig: {'converge': 1e-6, ss_thresh: [0, 0, 0, 0, 0, 0]}}
        axis_fit: {coeff: [-2.81754321e-8  1.91621915e-3  8.53133874e+2], unit: "A"}
        lines:
          - {label: 'main', window: [462, 568], continuum: 26, core: 515}
      - id: {'instrument': 'ViSP', 'data': 'BZNNG', mod: "SPD"}
        theme: {'D1': '#0000FF', 'D2': '#FF0000', 'Ni': '#FF0000'}
        residual: True
        axis_fit: {coeff: [-1.60283877e-8  1.42050858e-3  5.88875195e+2], unit: "A"}
        lines:
          - {label: 'D2', continuum: 375, core: 86,  window: [51, 121]}
          - {label: 'D1', continuum: 375, core: 509, window: [473, 545]}
          - {label: 'Ni', continuum: 375, core: 291, window: [256, 327]}
